name: CPBL 指定場次更新

on:
  workflow_dispatch:
    inputs:
      game_sno:
        description: "輸入場次，例如 2026-A-306"
        required: true
        type: string

jobs:
  update-game:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update specified game
        run: |
          python update_game.py "${{ inputs.game_sno }}"

      - name: Check changes
        run: |
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history/

          if git diff --cached --quiet; then
            echo "沒有資料變更，不建立 commit。"
          else
            git commit -m "Update game ${{ inputs.game_sno }}"
            git push
          fi
