name: Update CPBL Live Score

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘自動執行一次 (GitHub Actions 最快頻率為 5 分鐘)
workflow_dispatch: # 支援手動觸發執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-commits@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        run: python fetch_cpbl.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live_score.json
          git commit -m "Auto update live score" || exit 0
          git push
