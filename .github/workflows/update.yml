name: CPBL 自動更新

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cpbl-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 抓取 CPBL 最新資料
        run: python fetch_cpbl.py

      - name: 提交並推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json
          git add today-schedule.json
          git add live_score.json
          git add schedule/
          git add today/
          git add history/

          if git diff --cached --quiet; then
            echo "沒有新的資料需要提交"
            exit 0
          fi

          git commit -m "auto: update CPBL data"
          git push
