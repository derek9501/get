name: CPBL 自動更新

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpbl-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Fetch CPBL data
        run: python fetch_cpbl.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add today/ schedule/ history/ schedule.json today-schedule.json live_score.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update CPBL data"
            git push origin main
          fi
