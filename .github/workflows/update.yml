name: Update CPBL Live Score

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘自動執行一次
  workflow_dispatch:        # 支援在 GitHub 頁面手動觸發
  push:
    branches: [ main ]     # 變更推送到 main 分支時觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        run: python fetch_cpbl.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add today/ schedule/ history/
          git commit -m "Auto update CPBL today & history data" || exit 0
          git push origin main
          concurrency:
  group: cpbl-update
  cancel-in-progress: true
